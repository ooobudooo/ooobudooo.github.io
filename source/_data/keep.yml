## =====================================================================================
## Keep 主题配置（站点覆盖层）
## 文档: https://keep-docs.xpoet.cn     主题仓库: https://github.com/XPoet/hexo-theme-keep
##
## 工作机制（改配置前必读）:
##   主题默认配置在 node_modules/hexo-theme-keep/_config.yml。
##   主题脚本 scripts/events/init-config.js 会在 generateBefore 阶段把本文件
##   「按顶层键」浅合并进主题配置: { ...theme.config, ...data.keep }
##
## 由此有两条硬性约束:
##   1. 只写「与默认值不同」的顶层区块；与默认值相同的区块直接删掉，主题会自动沿用默认值。
##      —— 这正是本文件从 353 行精简到 4 个区块的原因。
##   2. 一旦保留某个区块，就必须把该区块的字段写全。浅合并是整体替换，
##      缺失的字段不会回退到默认值，而会变成 undefined。
##
## 当前需要覆盖的区块: base_info / menu / first_screen / scroll
## =====================================================================================

# 站点身份: 主色、标题、作者、头像、LOGO、favicon、明暗模式
# 文档: https://keep-docs.xpoet.cn/basis/configuration-guide/base_info.html
base_info:
  primary_color: "#446A37"            # 主题主色调（品牌绿）: 按钮、链接、高亮
  title: 林见的空间 LINXIAN's Zone      # 浏览器标签与页头展示的站点名
  author: Linxian                      # 文章页署名使用的作者名
  avatar: /images/obudoLow.png         # 头像，可写本地路径或图片链接
  logo: /images/obudoLow.png           # 站点 LOGO
  favicon: /images/obudoLow.png        # 浏览器标签页图标
  mode: dark                           # 默认配色 dark | light（默认配置无此键，必须显式声明）

# 顶部导航: 键为显示文字，值为路径；值后可接 `|| 图标类名`
# 注意: 每个路径都要有对应的 source/<name>/index.md，否则点击会 404
# 文档: https://keep-docs.xpoet.cn/basis/configuration-guide/menu.html
menu:
  首页: /                # 站点首页
  归档: /archives        # 由 hexo-generator-archive 生成
  # tags: /tags          # 启用前需先执行 hexo new page tags
  # categories: /categories   # 启用前需先执行 hexo new page categories
  友链: /links           # source/links/index.md（template: links）
  相册: /photos          # source/photos/index.md（template: photos）
  # tools: /tools        # 启用前需先执行 hexo new page tools
  # about: /about        # 启用前需先执行 hexo new page about
  文章: /essays          # source/essays/index.md
  日常: /daily           # source/daily/index.md

# 首屏（首页大图区域）
# 文档: https://keep-docs.xpoet.cn/basis/configuration-guide/first_screen.html
first_screen:
  enable: true                                          # 是否启用首屏大图（默认关闭）
  background_img: /images/staryTrackBackground.jpg       # 浅色模式背景图
  background_img_dark: /images/staryTrackBackground.jpg  # 深色模式背景图
  # 首屏文案: 用 || 换行，最多两行（第一行中文、第二行英文）
  description: 林寒涧肃，见素抱朴||Mainfest plainness, keep to the uncarved block.
  hitokoto: false                                       # 关闭「一言」随机文案，使用上面的固定文案

# 阅读滚动效果
# 文档: https://keep-docs.xpoet.cn/basis/configuration-guide/scroll.html
scroll:
  progress_bar: false   # 顶部阅读进度条
  percent: false        # 右上角阅读百分比
  hide_header: false    # 下滚时是否自动隐藏页头（默认 true，此处关闭）
